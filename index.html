<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050607">
<title>History Bank</title>
<style>
html,body{margin:0;height:100%;background:#050607;color:#f2f3f5;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
#loading{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box;font-size:13px;letter-spacing:.02em}
#loading small{display:block;margin-top:10px;color:#8e949e;font-size:10px;font-weight:400}
</style>
</head>
<body>
<div id="loading">History Bank<small>データを読み込んでいます</small></div>
<script>
(async()=>{
  try{
    const files=["payload/part-01.txt","payload/part-02.txt","payload/part-03.txt","payload/part-04.txt","payload/part-05.txt","payload/part-06.txt","payload/part-07.txt","payload/part-08.txt","payload/part-09.txt","payload/part-10.txt","payload/part-11.txt","payload/part-12.txt","payload/part-13.txt","payload/part-14.txt","payload/part-15.txt","payload/part-16.txt","payload/part-17.txt"],v='20260930-merger-reasons';
    const responses=await Promise.all(files.map(f=>fetch(f+'?v='+v,{cache:'no-cache'})));
    const bad=responses.find(r=>!r.ok);
    if(bad)throw new Error('データを読み込めませんでした ('+bad.status+')');
    const chunks=await Promise.all(responses.map(r=>r.text()));
    document.open();document.write(chunks.join(''));document.close();
  }catch(err){
    document.getElementById('loading').innerHTML='<strong>読み込みに失敗しました。</strong><small>'+String(err&&err.message||err)+'</small>';
  }
})();
</script>
</body>
</html>
